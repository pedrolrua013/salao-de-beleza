# Publica na AWS (ECS Fargate) a cada envio para a main, depois que o CI passar.
# Autentica por OIDC: nenhuma chave da AWS fica guardada no GitHub.
# Variáveis do repositório (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION=sa-east-1, AWS_ROLE_ARN, ECR_REPOSITORY=belezando, ECS_CLUSTER, ECS_SERVICE
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY   (valores públicos, embutidos na imagem)
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  publicar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Construir e enviar a imagem
        id: imagem
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPOSITORY }}
          VERSAO: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -t "$REGISTRO/$REPO:$VERSAO" .
          docker push "$REGISTRO/$REPO:$VERSAO"
          echo "imagem=$REGISTRO/$REPO:$VERSAO" >> "$GITHUB_OUTPUT"
      - id: tarefa
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs-task-definition.json
          container-name: app
          image: ${{ steps.imagem.outputs.imagem }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.tarefa.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
